<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Player</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <div id="app">
      
      <!-- Верхняя шапка приложения -->
      <header class="top-panel">
        <h1 class="app-title">Music Player</h1>

        <!-- Поисковая строка -->
        <div class="search-container">
          <svg class="search-icon icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" class="search-input" placeholder="Поиск треков, плейлистов..." />
        </div>

        <div class="top-panel-right"></div>
      </header>

      <!-- Боковая панель с управлением (слева) -->
      <aside class="sidebar-left">
        <div class="sidebar-card">
          <div class="sidebar-heading-left">Управление</div>
     
          <div class="sidebar-controls">
            <!-- Главная -->
            <button class="btn-ctrl" id="main-btn" title="Главная">
              <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
              </svg>
              <span>Главная</span>
            </button>

            <!-- Медиатека -->
            <button class="btn-ctrl" id="media-libary-btn" title="Медиатека">
              <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 18V5l12-2v13"></path>
                <circle cx="6" cy="18" r="3"></circle>
                <circle cx="18" cy="16" r="3"></circle>
              </svg>
              <span>Медиатека</span>
            </button>

            <!-- Плейлисты -->
            <button class="btn-ctrl" id="playlists-btn" title="Плейлисты">
              <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="8" y1="6" x2="21" y2="6"></line>
                <line x1="8" y1="12" x2="21" y2="12"></line>
                <line x1="8" y1="18" x2="21" y2="18"></line>
                <line x1="3" y1="6" x2="3.01" y2="6"></line>
                <line x1="3" y1="12" x2="3.01" y2="12"></line>
                <line x1="3" y1="18" x2="3.01" y2="18"></line>
              </svg>
              <span>Плейлисты</span>
            </button>
          </div>
        </div>
      </aside>

      <!-- Центральная область контента -->
      <main class="main-content">
        <section class="welcome-section">
          <h2 class="section-title">Главная</h2>
          <div class="quick-actions">
            <button class="action-card" id="scan-media-btn">
              <div class="action-icon">
                <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                  <line x1="12" y1="11" x2="12" y2="17"></line>
                  <line x1="9" y1="14" x2="15" y2="14"></line>
                </svg>
              </div>
              <div class="action-info">
                <h3>Открыть папку</h3>
                <p>Сканировать локальные треки</p>
              </div>
            </button>

            <button class="action-card" id="create-playlist-btn">
              <div class="action-icon">
                <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="12" y1="5" x2="12" y2="19"></line>
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
              </div>
              <div class="action-info">
                <h3>Создать плейлист</h3>
                <p>Собрать свой микс</p>
              </div>
            </button>
          </div>
        </section>

        <section class="content-section">
          <div class="section-header">
            <h3 class="section-subtitle">Недавно прослушано</h3>
          </div>
          <div class="cards-grid">
            <div class="media-card">
              <div class="card-cover-wrapper">
                <img src="./src/assets/dekma.jpeg" alt="Cover" class="card-cover" />
                <button class="card-play-btn">
                  <svg class="icon-svg" viewBox="0 0 24 24" fill="currentColor">
                    <polygon points="6,4 20,12 6,20" />
                  </svg>
                </button>
              </div>
              <div class="card-title">ПОНЯТЬ</div>
              <div class="card-artist">ВУЛЬФ, dekma</div>
            </div>
          </div>
        </section>
      </main>

      <!-- Боковая панель с информацией (справа) -->
      <aside class="sidebar-right">
        <div class="sidebar-card">
          <div class="sidebar-heading-right">Плейлист</div>
    
          <div class="sidebar-cover-wrapper">
            <img class="sidebar-cover" src="./src/assets/dekma.jpeg" alt="ПОНЯТЬ" />
          </div>

          <div class="sidebar-meta">
            <h2 class="sidebar-title">ПОНЯТЬ</h2>
            <p class="sidebar-artist">ВУЛЬФ, dekma</p>
          </div>
        </div>
      </aside>

      <!-- Нижнее окно -->
      <div class="player-bar">
        <!-- Информация о треке -->
        <div class="track-info">
          <div class="track-cover-wrapper">
            <img src="./src/assets/dekma.jpeg" alt="ПОНЯТЬ" class="track-cover-img" id="player-cover" />
          </div>
          <div class="track-text">
            <div class="track-title">ПОНЯТЬ</div>
            <div class="track-artist">ВУЛЬФ, dekma</div>
          </div>
        </div>

        <!-- Управление и прогресс слайдера -->
        <div class="player-center">
          <div class="controls">
            <button class="btn-ctrl" id="prev-btn">
              <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="19 20 9 12 19 4 19 20" fill="currentColor"></polygon>
                <line x1="5" y1="19" x2="5" y2="5"></line>
              </svg>
            </button>
            <button class="btn-ctrl play-btn" id="play-btn">
              <svg class="icon-svg" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="6,4 20,12 6,20" />
              </svg>
            </button>
            <button class="btn-ctrl" id="next-btn">
              <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="5 4 15 12 5 20 5 4" fill="currentColor"></polygon>
                <line x1="19" y1="5" x2="19" y2="19"></line>
              </svg>
            </button>
          </div>

          <div class="progress-container">
            <span class="time-text" id="current-time">0:00</span>
  
            <div class="progress-wrapper">
              <div class="progress-tooltip" id="progress-tooltip">0:00</div>
              <input type="range" class="progress-bar" id="progress-slider" min="0" max="100" value="0" />
            </div>

            <span class="time-text" id="total-time">3:24</span>
          </div>
        </div>

        <!-- Звук -->
        <div class="volume-control">
          <span class="volume-icon">
            <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            </svg>
          </span>
          <input type="range" class="volume-slider" id="volume-slider" min="0" max="100" value="80" />
        </div>
      </div>
    </div>

    <script type="module" src="src/main.ts"></script>
  </body>
</html>
